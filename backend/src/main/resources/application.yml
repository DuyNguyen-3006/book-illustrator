server:
  port: ${PORT:8080}

storage:
  # Local filesystem root for book text and generated images (spec §5.2 — no
  # S3/blob storage). Relative to the app's working directory unless overridden.
  root: ${STORAGE_ROOT:./data}

spring:
  servlet:
    multipart:
      # Spring Boot's default (1MB) rejects real books — Project Gutenberg .txt files
      # commonly run 500KB-2MB+ (code review P1 on issue #8).
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:book_illustrator}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
