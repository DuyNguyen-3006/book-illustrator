services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the $ so this is expanded inside the container (from env_file),
      # not by docker compose itself at parse time — see DECISIONS.md.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Overrides the .env default of localhost — inside the compose network the
      # Postgres container is reachable by service name, not localhost.
      DB_HOST: postgres
      # Book text/images must survive a container rebuild (spec §5.2 + resume
      # requirement) — write them to the mounted volume, not the container layer.
      STORAGE_ROOT: /data
    volumes:
      - appdata:/data
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - app
    # The only port a user needs: nginx serves the built app and proxies /api to
    # the API, so the browser talks to exactly one origin and the session cookie
    # stays first-party (no CORS configuration anywhere in the backend).
    ports:
      - "5173:80"

volumes:
  pgdata:
  appdata:
