server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Books are large; the API caps uploads at 10MB, so nginx must not reject
    # them first with its 1MB default.
    client_max_body_size 10m;

    # Same job as the Vite dev proxy: the browser only ever talks to this origin,
    # so the JSESSIONID cookie stays first-party and the backend needs no CORS.
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A pipeline step waits on Gemini for tens of seconds.
        proxy_read_timeout 180s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every other path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
